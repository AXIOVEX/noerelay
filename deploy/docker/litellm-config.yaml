model_list:
  # Primary: Remote GPU vLLM (Qwen3.8-27B via SSH tunnel)
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://remote-gpu-tunnel:4001/v1
      api_key: os.environ/REMOTE_NINFER_API_KEY
      rpm: 120
      timeout: 600
  # Fallback: Local Ollama (Qwen3.8-27B)
  - model_name: qwen3.8-27b-local
    litellm_params:
      model: ollama/qwen3.8:27b
      api_base: http://ollama:11434
      api_key: ollama
      rpm: 120
      timeout: 600
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 1
  allowed_fails: 0
  cooldown_time: 30
  fallbacks:
    - qwen3.8-27b: [qwen3.8-27b-local]
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
litellm_settings:
  drop_params: true
  request_timeout: 600
  set_verbose: false
